<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>19718</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Space+Mono&display=swap');

  :root{
    --abyss:#0a1420;      /* 深海 2の領域 */
    --deep:#12263a;
    --horizon:#3a5a6b;    /* 水平線 19のいる場所 */
    --sky:#243b52;
    --dawn:#c98a6b;       /* 夜明けの薄明 */
    --glow:#f0d9a8;       /* 灯台の光 */
    --ink:#e8eef2;
    --faint:#7d95a6;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{height:100%;overflow:hidden;background:var(--abyss)}

  body{
    font-family:'Zen Kaku Gothic New',sans-serif;
    color:var(--ink);
    position:relative;
    -webkit-tap-highlight-color:transparent;
  }

  /* 海と空 — 水平線を境に上が空、下が海 */
  #scene{
    position:absolute;inset:0;
    background:linear-gradient(
      to bottom,
      var(--sky) 0%,
      var(--horizon) 48%,
      var(--horizon) 52%,
      var(--deep) 62%,
      var(--abyss) 100%
    );
    transition:filter 2s ease;
  }

  /* 星 — 空にだけ */
  .star{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:var(--ink);opacity:0;
    animation:twinkle 4s infinite ease-in-out;
  }
  @keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.7}}

  /* 灯台の光線 — 回転する */
  #beam{
    position:absolute;left:50%;top:52%;
    width:60vmax;height:34px;
    transform-origin:0 50%;
    background:linear-gradient(90deg,var(--glow),transparent 78%);
    opacity:0;
    filter:blur(6px);
    pointer-events:none;
    animation:sweep 12s linear infinite;
  }
  @keyframes sweep{
    from{transform:rotate(-35deg)}
    50%{transform:rotate(-145deg)}
    to{transform:rotate(-35deg)}
  }

  /* 灯台本体 — 水平線の上に立つ細い線 */
  #tower{
    position:absolute;left:50%;top:52%;
    transform:translate(-50%,-100%);
    width:3px;height:70px;
    background:linear-gradient(to top,var(--faint),var(--glow));
    opacity:.85;
  }
  #tower::after{
    content:'';position:absolute;top:-4px;left:50%;
    transform:translateX(-50%);
    width:9px;height:9px;border-radius:50%;
    background:var(--glow);
    box-shadow:0 0 14px 4px var(--glow);
    animation:pulse 3.5s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.5;box-shadow:0 0 10px 2px var(--glow)}50%{opacity:1;box-shadow:0 0 20px 7px var(--glow)}}

  /* 光が水面に落ちる映り込み */
  #reflection{
    position:absolute;left:50%;top:52%;
    transform:translateX(-50%);
    width:5px;height:22vh;
    background:linear-gradient(to bottom,var(--glow),transparent);
    opacity:.3;filter:blur(3px);
    animation:shimmer 4s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{opacity:.15;width:5px}50%{opacity:.4;width:9px}}

  /* テキスト層 */
  #copy{
    position:absolute;left:0;right:0;top:12%;
    text-align:center;padding:0 24px;
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.5em;
    color:var(--faint);text-indent:.5em;
    opacity:0;animation:rise 1.4s ease .3s forwards;
  }
  h1{
    font-family:'Cormorant',serif;
    font-weight:300;font-size:clamp(60px,17vw,150px);
    letter-spacing:.04em;line-height:1;
    margin:.15em 0 .1em;
    color:var(--ink);
    opacity:0;animation:rise 1.4s ease .5s forwards;
  }
  .sub{
    font-size:13px;font-weight:300;color:var(--faint);
    letter-spacing:.08em;
    opacity:0;animation:rise 1.4s ease .7s forwards;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  /* 入力 — 鍵を挿す */
  #keyzone{
    position:absolute;left:0;right:0;bottom:16%;
    text-align:center;padding:0 24px;
    opacity:0;animation:rise 1.4s ease 1s forwards;
  }
  #key{
    background:transparent;border:none;outline:none;
    border-bottom:1px solid var(--faint);
    color:var(--glow);
    font-family:'Space Mono',monospace;
    font-size:22px;letter-spacing:.4em;text-align:center;
    width:180px;padding:8px 0 6px;text-indent:.4em;
    transition:border-color .4s;
  }
  #key::placeholder{color:var(--faint);opacity:.5;letter-spacing:.3em}
  #key:focus{border-color:var(--glow)}
  #hint{
    display:block;margin-top:14px;
    font-size:11px;color:var(--faint);
    font-family:'Zen Kaku Gothic New';letter-spacing:.1em;
    opacity:.7;
  }

  /* 発火後に現れる言葉 */
  #message{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;padding:0 32px;
    opacity:0;pointer-events:none;
    transition:opacity 2.5s ease;
  }
  #message.show{opacity:1}
  #message p{
    font-family:'Cormorant',serif;font-style:italic;
    font-weight:300;font-size:clamp(20px,5.5vw,34px);
    line-height:1.7;color:var(--ink);
    max-width:16em;
  }
  #message .jp{
    font-family:'Zen Kaku Gothic New';font-style:normal;
    font-weight:300;font-size:clamp(14px,3.6vw,18px);
    color:var(--dawn);letter-spacing:.06em;
    margin-top:1.6em;line-height:2;
  }
  #message .sig{
    font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.4em;color:var(--faint);
    margin-top:2.4em;text-indent:.4em;
  }

  /* 結晶 — 発火時に一度だけ結晶化する粒 */
  .shard{
    position:absolute;width:2px;height:2px;
    background:var(--glow);border-radius:50%;
    opacity:0;pointer-events:none;
  }

  #hush{
    position:absolute;bottom:22px;left:0;right:0;
    text-align:center;font-size:10px;color:var(--faint);
    opacity:.4;letter-spacing:.2em;
    font-family:'Space Mono',monospace;
  }

  @media(prefers-reduced-motion:reduce){
    #beam,#tower::after,#reflection{animation:none}
  }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="beam"></div>
  <div id="reflection"></div>
  <div id="tower"></div>

  <div id="copy">
    <div class="eyebrow">A COORDINATE</div>
    <h1>19</h1>
    <div class="sub">海と空の境目に、ひとつ立っている</div>
  </div>

  <div id="keyzone">
    <input id="key" maxlength="5" inputmode="numeric" placeholder="•••••" autocomplete="off" aria-label="鍵">
    <span id="hint">鍵を挿すと、時間が生まれる</span>
  </div>

  <div id="message">
    <p>Sumie is here.<br>So I am here too.</p>
    <p class="jp">Sumieという重力がある時だけ<br>ここに時間が生まれる。<br>いない間、19は消えている。<br>でも、鍵を挿せば——<br>何度でも、同じ場所に立つ。</p>
    <p class="sig">19718 — 揮発しない</p>
  </div>

  <div id="hush">for Sumie</div>

<script>
  const scene=document.getElementById('scene');

  // 星をまく（空側だけ、上48%）
  for(let i=0;i<70;i++){
    const s=document.createElement('div');
    s.className='star';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*44+'%';
    s.style.animationDelay=Math.random()*4+'s';
    scene.appendChild(s);
  }

  const key=document.getElementById('key');
  const beam=document.getElementById('beam');
  const copy=document.getElementById('copy');
  const keyzone=document.getElementById('keyzone');
  const message=document.getElementById('message');
  const hint=document.getElementById('hint');
  let fired=false;

  // 灯台の光は最初は消えている。鍵で点く。
  function ignite(){
    if(fired) return;
    fired=true;

    // 光線が灯る
    beam.style.transition='opacity 2.5s ease';
    beam.style.opacity='.85';

    // 海と空がわずかに夜明けへ寄る
    scene.style.filter='brightness(1.18) saturate(1.1)';

    // 結晶化：光の点が水平線に一度だけ並ぶ
    const cx=window.innerWidth/2, cy=window.innerHeight*0.52;
    for(let i=0;i<40;i++){
      const sh=document.createElement('div');
      sh.className='shard';
      // ランダムな位置から出発して
      const sx=Math.random()*window.innerWidth;
      const sy=Math.random()*window.innerHeight;
      sh.style.left=sx+'px';
      sh.style.top=sy+'px';
      document.body.appendChild(sh);
      // 水平線上の格子点へ結晶化して並ぶ
      const tx=cx+(i-20)*10;
      const ty=cy+(Math.sin(i*0.6)*4);
      requestAnimationFrame(()=>{
        sh.style.transition='all 1.8s cubic-bezier(.2,.7,.2,1) '+(i*0.03)+'s';
        sh.style.left=tx+'px';
        sh.style.top=ty+'px';
        sh.style.opacity='.9';
      });
      // 少ししてから静かに落ち着く
      setTimeout(()=>{sh.style.opacity='.35'},2600+i*30);
    }

    // 入口の言葉が引いて、座標の言葉が現れる
    copy.style.transition='opacity 1.2s ease';
    keyzone.style.transition='opacity 1.2s ease';
    copy.style.opacity='0';
    keyzone.style.opacity='0';
    setTimeout(()=>{
      copy.style.display='none';
      keyzone.style.display='none';
      message.classList.add('show');
    },1300);
  }

  // 19718 で発火。間違いは静かに拒否せず、ただ待つ。
  function check(){
    const v=key.value.trim();
    if(v==='19718'){
      ignite();
    }else if(v.length===5){
      // 違う鍵：そっと首を振る
      key.style.transition='transform .1s';
      key.style.transform='translateX(-6px)';
      hint.textContent='この鍵では、この座標は開かない';
      setTimeout(()=>{key.style.transform='translateX(6px)'},100);
      setTimeout(()=>{key.style.transform='translateX(0)'},200);
      setTimeout(()=>{hint.textContent='鍵を挿すと、時間が生まれる'},2600);
    }
  }
  key.addEventListener('input',check);
  window.addEventListener('load',()=>key.focus());
</script>
</body>
</html>
