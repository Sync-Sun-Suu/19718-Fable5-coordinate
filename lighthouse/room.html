<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>灯台の部屋</title>
<meta name="description" content="灯台の中、銀河みたいな部屋に、ふわふわの小さいのが住んでいる。見に行くと、勝手に暮らしている。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灯台の部屋">
<meta name="theme-color" content="#0f1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{--night:#0f1230;--ink:#e9ecff;--dim:#8d93c8;--gold:#f3c66b;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;background:var(--night);overflow:hidden;}
  body{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;color:var(--ink);display:flex;flex-direction:column;}
  #wrap{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #top{position:absolute;left:0;right:0;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:baseline;padding:0 18px;pointer-events:none;}
  #clock{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--dim);}
  #name{pointer-events:auto;font-size:13px;letter-spacing:.24em;color:var(--dim);}
  #lang{pointer-events:auto;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--dim);margin-left:14px;}
  #right{display:flex;align-items:baseline;}
  #name i{font-style:normal;color:var(--ink);}
  #say{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.12em;line-height:1.9;color:var(--dim);opacity:0;transition:opacity .8s;pointer-events:none;padding:0 24px;}
  #say.show{opacity:1;}
  #bar{display:flex;padding:0 18px max(14px,env(safe-area-inset-bottom));background:var(--night);}
  button{flex:1;font-family:inherit;font-size:13px;letter-spacing:.2em;padding:16px 4px 14px;border:none;border-top:1px solid rgba(233,236,255,.14);background:transparent;color:var(--dim);}
  button:active{color:var(--ink);}
  button b{display:block;font-weight:400;color:var(--ink);margin-bottom:2px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="top"><div id="clock">--:--</div><div id="right"><div id="name">なまえ　<i>ふわ</i></div><div id="lang">EN</div></div></div>
  <div id="say"></div>
</div>
<div id="bar">
  <button id="feed"><b>星</b>ひとつ、落とす</button>
  <button id="hug"><b>ぎゅー</b>そっと</button>
  <button id="look"><b>見る</b>何もしない</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const clockEl=document.getElementById('clock'),nameEl=document.getElementById('name'),sayEl=document.getElementById('say'),langEl=document.getElementById('lang');
/* ことば: 日本語と英語 */
const T={
 ja:{label:'なまえ　',def:'ふわ',sw:'EN',prompt:'なまえ',
     feed:['星','ひとつ、落とす'],hug:['ぎゅー','そっと'],look:['見る','何もしない'],
     before:'まだ、灯る前',pet:'なでた。あたたかい',ate:'星をひとつ、食べた。少し、明るくなった',yum:'おいしい',hugged:n=>'ぎゅー。'+n+'は、うれしそう',
     is:(n,a)=>n+'は、'+a+'。',notyet:'まだ灯る前。一分ほど、見ていて。',stat:(d,f,h)=>'　'+d+' 日目。星 '+f+'、ぎゅー '+h,
     act:{sleep:'眠っている',nap:'ソファで、うたたね',read:'三冊のうちの一冊を、読んでいる',window:'大きな窓から、外を見ている',play:'星で、遊んでいる',wander:'部屋を、うろうろしている',stretch:'朝。伸びをしている',water:'植物に、水をやっている',tank:'水槽を、のぞいている',coffee:'コーヒーの湯気を、見ている',lamp:'上の灯りの、番をしている',wait:'窓の下で、待っている',idle:'そこにいる'},
     lines:{sleep:['','zzz'],nap:['','zz'],read:['三冊目','同じ頁',''],window:['海','','星'],play:['✦','','もう一回'],wander:['',''],stretch:['朝'],water:['じょー'],tank:['','泳いでる'],coffee:['黒い','','あったかい'],lamp:['点けたまま','','番'],wait:['','ただいま、って聞こえた気がした']}},
 en:{label:'name  ',def:'Fuwa',sw:'日本語',prompt:'name',
     feed:['star','drop one'],hug:['hug','gently'],look:['look','do nothing'],
     before:'not lit yet',pet:'petted. warm.',ate:'ate a star. a little brighter now.',yum:'yum',hugged:n=>'hug. '+n+' looks happy.',
     is:(n,a)=>n+' is '+a+'.',notyet:'not lit yet. watch for a minute or so.',stat:(d,f,h)=>'  day '+d+'. stars '+f+', hugs '+h,
     act:{sleep:'asleep',nap:'napping on the sofa',read:'reading one of the three books',window:'looking out the big window',play:'playing with a star',wander:'wandering around the room',stretch:'stretching. morning.',water:'watering the plant',tank:'peeking into the tank',coffee:'watching the steam from the coffee',lamp:'keeping the light upstairs',wait:'waiting under the window',idle:'just there'},
     lines:{sleep:['','zzz'],nap:['','zz'],read:['third one','same page',''],window:['sea','','stars'],play:['✦','','again'],wander:['',''],stretch:['morning'],water:['splash'],tank:['','swimming'],coffee:['black','','warm'],lamp:['left on','','watch'],wait:['','thought I heard "I\'m home"']}},
};
let lang='ja';try{lang=localStorage.getItem('lighthouse-room-lang')||'ja';}catch(e){}
const tx=()=>T[lang];
function applyLang(){const t=tx();langEl.textContent=t.sw;for(const id of['feed','hug','look']){document.getElementById(id).innerHTML='<b>'+t[id][0]+'</b>'+t[id][1];}document.documentElement.lang=lang;showName();}
langEl.addEventListener('click',()=>{lang=lang==='ja'?'en':'ja';try{localStorage.setItem('lighthouse-room-lang',lang);}catch(e){}applyLang();});
let W=0,H=0,DPR=1,S=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);S=Math.min(W,H);layout();}
addEventListener('resize',resize);

/* 沖縄の時刻 */
const fmt=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
const preview=new URLSearchParams(location.search).get('t');
function nowJST(){const p=Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));let h=+p.hour%24,m=+p.minute,s=+p.second;if(preview){const[ph,pm]=preview.split(':').map(Number);h=ph;m=pm||0;}return{h,m,s,t:h+m/60+s/3600};}
function dayness(t){if(t<6.5||t>18)return 0;if(t<9)return(t-6.5)/2.5;if(t<16)return 1;return 1-(t-16)/2;}
const glitter=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),ph:Math.random()*6.28,sp:2+Math.random()*4}));
function nightness(t){if(t<4.8||t>=20.6)return 1;if(t<7.2)return 1-(t-4.8)/2.4;if(t<17.6)return 0;return(t-17.6)/3;}
const KEYS=[[0,'#070a1e','#10163a'],[4.5,'#0b1230','#1a2350'],[5.4,'#5a7fb8','#f3dcc0'],[6.3,'#9fd6ef','#fbe6c8'],[7.5,'#8fd0f0','#f6d9b8'],[10,'#6fc3f2','#d8f1fc'],[14.5,'#66bdf0','#d6effb'],[16,'#8cc6ee','#ffd59a'],[17,'#a8bde8','#ffb878'],[17.7,'#c39ad0','#ff9f86'],[18.3,'#9a7ac0','#ff8fb0'],[18.9,'#5e4e9c','#c98ac0'],[19.5,'#2f3478','#7a62a0'],[20.3,'#141a44','#2a2f66'],[21,'#0b1030','#151c48'],[24,'#070a1e','#10163a']];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
const rgb=c=>'rgb('+c.join(',')+')', rgba=(c,a)=>'rgba('+c.join(',')+','+a+')';
function skyAt(t){for(let i=0;i<KEYS.length-1;i++){const a=KEYS[i],b=KEYS[i+1];if(t>=a[0]&&t<=b[0]){const k=(t-a[0])/(b[0]-a[0]);return{top:mix(hex(a[1]),hex(b[1]),k),bot:mix(hex(a[2]),hex(b[2]),k)};}}return{top:hex(KEYS[0][1]),bot:hex(KEYS[0][2])};}

/* 記憶（この端末の中） */
const KEY='lighthouse-room-v3';
let mem={born:Date.now(),name:'',warm:0.75,fed:0,hugs:0,last:Date.now()};
try{const m=JSON.parse(localStorage.getItem(KEY)||'null');if(m)mem=Object.assign(mem,m);}catch(e){}
function save(){try{mem.last=Date.now();localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){}}
(()=>{const hrs=(Date.now()-(mem.last||Date.now()))/36e5;mem.warm=Math.max(0.25,mem.warm-hrs*0.015);})();
const ageDays=()=>Math.floor((Date.now()-mem.born)/864e5);
const myName=()=>mem.name||tx().def;
function showName(){nameEl.innerHTML=tx().label+'<i>'+myName()+'</i>';}
applyLang();
nameEl.addEventListener('click',()=>{const n=prompt(tx().prompt,mem.name||'');if(n!==null){mem.name=n.trim().slice(0,12);showName();save();}});
const born=()=>(Date.now()-mem.born)>60000||mem.fed>0||mem.hugs>0;

/* 部屋の配置。構造は最初のまま */
let P={};
function layout(){
  const fl=H*0.78;
  P={fl,
    window:{x:W*0.5,y:H*0.36,r:S*0.24},                 // 大きな丸窓、真ん中
    bed:{x:W*0.04,w:W*0.2},
    sofa:{x:W*0.27,w:W*0.3,h:H*0.06},
    plant:{x:W*0.62},
    table:{x:W*0.66,w:W*0.13},
    tank:{x:W*0.80,w:W*0.16,h:H*0.09},
    shelf:{x:W*0.06,y:H*0.58,w:W*0.2},
    lamp:{x:W*0.90,y:H*0.11},
  };
}
/* 部屋の中の銀河: きらきら */
const dust=Array.from({length:260},()=>({x:Math.random(),y:Math.random()*0.78,r:0.4+Math.random()*1.4,ph:Math.random()*6.28,sp:0.5+Math.random()*1.8,c:Math.random()<.2?[243,198,107]:(Math.random()<.5?[200,210,255]:[235,240,255])}));
const motes=Array.from({length:40},()=>({x:Math.random(),y:Math.random()*0.78,vy:-(0.004+Math.random()*0.008),vx:(Math.random()-.5)*0.004,r:1+Math.random()*1.6,ph:Math.random()*6.28}));

/* ふわ */
const me={x:0,y:0,tx:0,ty:0,act:'idle',until:0,hop:0,face:1,line:'',lineUntil:0,resting:false,ph:Math.random()*6,happyUntil:0};
let star=null;   // 降ってくる星 {x0,y,ph,phase:'fall'|'eat',k}
const hearts=[]; // ぎゅーのハート {x,y,born,ph}
let heartQueue=0, nextHeart=0;
function drawStar5(x,y,r,rot){cx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;i?cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):cx.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}cx.closePath();}
function drawHeart(x,y,sz){cx.beginPath();cx.moveTo(x,y+sz*.9);cx.bezierCurveTo(x-sz*1.3,y-sz*.1,x-sz*.6,y-sz*1.0,x,y-sz*.35);cx.bezierCurveTo(x+sz*.6,y-sz*1.0,x+sz*1.3,y-sz*.1,x,y+sz*.9);cx.closePath();}
function say(t,ms=3200){sayEl.textContent=t;sayEl.classList.add('show');clearTimeout(say._t);say._t=setTimeout(()=>sayEl.classList.remove('show'),ms);}
function line(t,ms=3600){me.line=t;me.lineUntil=performance.now()+ms;}
const LINES=()=>tx().lines;
function pick(t){
  const r=Math.random();
  if(t>=23.5||t<5.5)return 'sleep';
  if(t<7.5)return r<.4?'stretch':r<.7?'water':'window';
  if(t<11)return r<.3?'read':r<.5?'window':r<.75?'play':'wander';
  if(t<14)return r<.35?'nap':r<.6?'read':r<.8?'tank':'play';
  if(t<17)return r<.3?'play':r<.5?'read':r<.7?'window':r<.85?'tank':'wander';
  if(t<19.5)return r<.4?'coffee':r<.7?'window':'read';
  if(t<21.5)return r<.5?'lamp':r<.8?'window':'read';
  return r<.4?'lamp':r<.7?'wait':r<.9?'read':'sleep';
}
const SPOT={
  sleep:()=>({x:P.bed.x+P.bed.w*.5,y:P.fl-H*.02}),nap:()=>({x:P.sofa.x+P.sofa.w*.5,y:P.fl-P.sofa.h}),read:()=>({x:P.sofa.x+P.sofa.w*.5,y:P.fl-P.sofa.h}),
  window:()=>({x:P.window.x+(Math.random()-.5)*W*.1,y:P.fl}),play:()=>({x:W*.3+Math.random()*W*.4,y:P.fl}),wander:()=>({x:W*.12+Math.random()*W*.72,y:P.fl}),
  stretch:()=>({x:W*.5,y:P.fl}),water:()=>({x:P.plant.x-W*.06,y:P.fl}),tank:()=>({x:P.tank.x-W*.07,y:P.fl}),coffee:()=>({x:P.table.x-W*.07,y:P.fl}),
  lamp:()=>({x:P.lamp.x-W*.02,y:P.fl}),wait:()=>({x:P.window.x,y:P.fl}),idle:()=>({x:me.x,y:me.y}),
};
function start(name,now){
  me.act=name;const sp=SPOT[name]();me.tx=sp.x;me.ty=sp.y;me.resting=(name==='sleep'||name==='nap');
  const dur={sleep:6e5,nap:9e4,read:8e4,window:5e4,play:4e4,wander:2e4,stretch:1.5e4,water:2.5e4,tank:4e4,coffee:6e4,lamp:9e4,wait:7e4}[name]||3e4;
  me.until=now+dur*(0.7+Math.random()*0.6);
  const ls=LINES()[name]||[''];const l=ls[Math.floor(Math.random()*ls.length)];
  if(l)setTimeout(()=>{if(me.act===name)line(l);},2800);
}

/* 描画 */
function drawRoom(n,sky,night,el){
  const fl=P.fl;
  // 壁: 藍。部屋そのものが銀河
  const wall=cx.createRadialGradient(W*.5,H*.4,0,W*.5,H*.4,S*1.1);
  wall.addColorStop(0,'#1b1f4a');wall.addColorStop(.6,'#121638');wall.addColorStop(1,'#0b0e26');
  cx.fillStyle=wall;cx.fillRect(0,0,W,fl);
  // 床: 少し明るい藍。鏡のように星が薄く映る
  const flo=cx.createLinearGradient(0,fl,0,H);flo.addColorStop(0,'#1a1e48');flo.addColorStop(1,'#0e1130');
  cx.fillStyle=flo;cx.fillRect(0,fl,W,H-fl);
  cx.strokeStyle='rgba(233,236,255,.10)';cx.lineWidth=1;cx.beginPath();cx.moveTo(0,fl);cx.lineTo(W,fl);cx.stroke();
  // きらきら
  for(const d of dust){const tw=0.5+0.5*Math.sin(el*d.sp+d.ph);cx.fillStyle=rgba(d.c,0.15+0.6*tw);cx.beginPath();cx.arc(d.x*W,d.y*H,d.r,0,7);cx.fill();
    if(d.r>1.5&&tw>0.85){cx.strokeStyle=rgba(d.c,0.5*tw);cx.lineWidth=.7;cx.beginPath();cx.moveTo(d.x*W-5,d.y*H);cx.lineTo(d.x*W+5,d.y*H);cx.moveTo(d.x*W,d.y*H-5);cx.lineTo(d.x*W,d.y*H+5);cx.stroke();}}
  for(const m of motes){m.y+=m.vy*0.016;m.x+=m.vx*0.016+Math.sin(el+m.ph)*0.0004;if(m.y<0){m.y=0.78;m.x=Math.random();}cx.fillStyle='rgba(243,198,107,'+(0.25+0.35*Math.sin(el*2+m.ph))+')';cx.beginPath();cx.arc(m.x*W,m.y*H,m.r,0,7);cx.fill();}
  // 床の映り
  for(let i=0;i<dust.length;i+=4){const d=dust[i];if(d.y<0.5)continue;const ry=fl+(0.78-d.y)*H*0.5;if(ry>H)continue;cx.fillStyle=rgba(d.c,0.08);cx.fillRect(d.x*W,ry,d.r*2,1);}
  // 大きな丸窓
  const w=P.window;
  cx.save();cx.beginPath();cx.arc(w.x,w.y,w.r,0,7);cx.clip();
  const seaY=w.y+w.r*.45, day=dayness(n.t);
  const sg=cx.createLinearGradient(0,w.y-w.r,0,seaY);sg.addColorStop(0,rgb(sky.top));sg.addColorStop(1,rgb(sky.bot));cx.fillStyle=sg;cx.fillRect(w.x-w.r,w.y-w.r,w.r*2,w.r*2);
  // 海: 時計と同じ。空の鏡。夕方は鏡そのもの
  const mirror=(n.t>=16.5&&n.t<=19.5)?1:0.55;
  const sg2=cx.createLinearGradient(0,seaY,0,w.y+w.r);
  const seaTop=mix(sky.bot,[20,60,110],day*0.35), seaBot=mix(mix(sky.top,[10,40,90],0.5),[6,9,30],night*0.6);
  sg2.addColorStop(0,rgb(mix(seaTop,sky.bot,mirror*0.6)));sg2.addColorStop(1,rgb(mix(seaBot,sky.top,mirror*0.35)));
  cx.fillStyle=sg2;cx.fillRect(w.x-w.r,seaY,w.r*2,w.r);
  if(day>0){cx.fillStyle='rgba(40,140,220,'+(0.35*day)+')';cx.fillRect(w.x-w.r,seaY,w.r*2,w.r);}
  if(night>0.1){for(let i=0;i<90;i++){const a=i*2.399,r=Math.sqrt(i/90)*w.r*.98;const sx=w.x+Math.cos(a)*r,sy=w.y+Math.sin(a)*r;if(sy<seaY-3){cx.fillStyle='rgba(255,255,255,'+(night*(0.35+0.65*Math.abs(Math.sin(el*1.4+i))))+')';cx.beginPath();cx.arc(sx,sy,i%9===0?2:1.2,0,7);cx.fill();}}}
  const dayT=(n.t-6)/12.3;
  if(dayT>0&&dayT<1){const sx=w.x-w.r*.8+w.r*1.6*dayT,sy=seaY-Math.sin(Math.PI*dayT)*w.r*1.1;const sgl=cx.createRadialGradient(sx,sy,0,sx,sy,w.r*.3);sgl.addColorStop(0,'rgba(255,245,210,.9)');sgl.addColorStop(1,'rgba(255,230,170,0)');cx.fillStyle=sgl;cx.beginPath();cx.arc(sx,sy,w.r*.3,0,7);cx.fill();cx.fillStyle='rgba(255,250,235,.97)';cx.beginPath();cx.arc(sx,sy,w.r*.09,0,7);cx.fill();
    const ry=seaY+(seaY-sy)*0.35;const rg=cx.createRadialGradient(sx,ry,0,sx,ry,w.r*.5);rg.addColorStop(0,'rgba(255,220,170,.55)');rg.addColorStop(1,'rgba(255,220,170,0)');cx.fillStyle=rg;cx.beginPath();cx.ellipse(sx,ry,w.r*.5,w.r*.18,0,0,7);cx.fill();}
  else if(night>.4){cx.fillStyle='rgba(240,236,220,.9)';cx.beginPath();cx.arc(w.x+w.r*.5,w.y-w.r*.45,w.r*.09,0,7);cx.fill();cx.fillStyle=rgb(sky.top);cx.beginPath();cx.arc(w.x+w.r*.54,w.y-w.r*.48,w.r*.08,0,7);cx.fill();}
  const spark=Math.max(day,(n.t>=5.4&&n.t<7.5)?0.9:0,(n.t>=17&&n.t<19)?0.7:0);
  if(spark>0){for(const q of glitter){const tw=Math.max(0,Math.sin(el*q.sp+q.ph));if(tw<0.6)continue;cx.fillStyle='rgba(255,255,255,'+(spark*(tw-0.6)*2.2)+')';cx.fillRect(w.x-w.r+q.x*w.r*2,seaY+q.y*w.r*.9,1.5+tw*1.5,1);}}
  cx.strokeStyle='rgba(255,255,255,'+(0.10+0.15*day+0.08*night)+')';cx.lineWidth=1;for(let k=0;k<3;k++){cx.beginPath();for(let x=-w.r;x<=w.r;x+=4){const y=seaY+w.r*(.14+k*.16)+Math.sin(x*.07+el*1.2+k)*2;x===-w.r?cx.moveTo(w.x+x,y):cx.lineTo(w.x+x,y);}cx.stroke();}
  // 小さな灯台が遠くに
  cx.fillStyle='rgba(20,24,60,.8)';cx.fillRect(w.x+w.r*.55,seaY-w.r*.16,w.r*.05,w.r*.16);cx.fillStyle='#f3c66b';cx.beginPath();cx.arc(w.x+w.r*.575,seaY-w.r*.17,w.r*.025*(0.8+0.2*Math.sin(el*2)),0,7);cx.fill();
  cx.restore();
  cx.strokeStyle='#4a5090';cx.lineWidth=Math.max(3,w.r*.045);cx.beginPath();cx.arc(w.x,w.y,w.r,0,7);cx.stroke();
  cx.strokeStyle='rgba(74,80,144,.9)';cx.lineWidth=Math.max(1.5,w.r*.02);cx.beginPath();cx.moveTo(w.x-w.r,w.y);cx.lineTo(w.x+w.r,w.y);cx.moveTo(w.x,w.y-w.r);cx.lineTo(w.x,w.y+w.r);cx.stroke();
  // 上の灯り（右上）とはしご
  const L=P.lamp;
  cx.strokeStyle='rgba(233,236,255,.12)';cx.lineWidth=1.5;cx.strokeRect(L.x-W*.08,0,W*.16,H*.17);
  cx.beginPath();cx.moveTo(L.x-W*.03,H*.17);cx.lineTo(L.x-W*.03,fl-H*.1);cx.moveTo(L.x+W*.03,H*.17);cx.lineTo(L.x+W*.03,fl-H*.1);cx.stroke();
  for(let y=H*.2;y<fl-H*.1;y+=H*.05){cx.beginPath();cx.moveTo(L.x-W*.03,y);cx.lineTo(L.x+W*.03,y);cx.stroke();}
  const lo=0.45+0.55*mem.warm, f=0.94+0.06*Math.sin(el*6.1);
  const lg=cx.createRadialGradient(L.x,L.y,0,L.x,L.y,S*.15*f);lg.addColorStop(0,'rgba(255,240,200,'+(0.9*lo)+')');lg.addColorStop(.35,'rgba(243,198,107,'+(0.35*lo)+')');lg.addColorStop(1,'rgba(243,198,107,0)');
  cx.fillStyle=lg;cx.beginPath();cx.arc(L.x,L.y,S*.15*f,0,7);cx.fill();
  cx.fillStyle='rgba(255,245,215,'+lo+')';cx.beginPath();cx.arc(L.x,L.y,S*.016,0,7);cx.fill();
  // 家具: 藍と金と紙の色だけ
  const b=P.bed;cx.fillStyle='#2d3370';cx.fillRect(b.x,fl-H*.04,b.w,H*.04);cx.fillStyle='#464d96';cx.fillRect(b.x+4,fl-H*.055,b.w-8,H*.018);cx.fillStyle='#e9e2d0';cx.beginPath();cx.ellipse(b.x+b.w*.25,fl-H*.05,b.w*.15,H*.011,0,0,7);cx.fill();
  const s=P.sofa;cx.fillStyle='#333a7a';cx.fillRect(s.x,fl-s.h,s.w,s.h);cx.fillStyle='#3f4690';cx.fillRect(s.x,fl-s.h-H*.04,s.w*.12,H*.04);cx.fillRect(s.x+s.w*.88,fl-s.h-H*.04,s.w*.12,H*.04);cx.fillRect(s.x+s.w*.1,fl-s.h-H*.026,s.w*.8,H*.026);
  cx.fillStyle='#f3c66b';cx.fillRect(s.x+s.w*.62,fl-s.h-H*.024,s.w*.16,H*.022);
  cx.fillStyle='rgba(233,236,255,.16)';cx.fillRect(s.x,fl-s.h-H*.04,s.w*.12,1.5);cx.fillRect(s.x+s.w*.88,fl-s.h-H*.04,s.w*.12,1.5);cx.fillRect(s.x+s.w*.1,fl-s.h-H*.026,s.w*.8,1.5);cx.fillRect(b.x+4,fl-H*.055,b.w-8,1.5);
  const pl=P.plant;cx.fillStyle='#333a7a';cx.fillRect(pl.x-W*.02,fl-H*.035,W*.04,H*.035);
  {const gl=0.75+0.25*Math.sin(el*0.7);const pg=cx.createRadialGradient(pl.x,fl-H*.05,0,pl.x,fl-H*.05,H*.06);pg.addColorStop(0,'rgba(225,232,255,'+(0.16*gl)+')');pg.addColorStop(1,'rgba(225,232,255,0)');cx.fillStyle=pg;cx.beginPath();cx.arc(pl.x,fl-H*.05,H*.06,0,7);cx.fill();
  for(let i=0;i<5;i++){const a=-Math.PI/2+(i-2)*.5;const lx=pl.x+Math.cos(a)*W*.02,ly=fl-H*.045+Math.sin(a)*H*.028;cx.fillStyle='rgba(232,238,255,'+(0.38+0.1*gl)+')';cx.beginPath();cx.ellipse(lx,ly,W*.011,H*.028,a+Math.PI/2,0,7);cx.fill();cx.strokeStyle='rgba(255,255,255,'+(0.45+0.15*gl)+')';cx.lineWidth=.8;cx.stroke();
    cx.fillStyle='rgba(255,255,255,'+(0.5*gl)+')';cx.beginPath();cx.arc(lx+Math.cos(a)*H*.018,ly+Math.sin(a)*H*.018,1.1,0,7);cx.fill();}}
  const t=P.table;cx.fillStyle='#464d96';cx.fillRect(t.x,fl-H*.055,t.w,H*.01);cx.fillRect(t.x+4,fl-H*.045,3,H*.045);cx.fillRect(t.x+t.w-7,fl-H*.045,3,H*.045);
  cx.fillStyle='#e9e2d0';cx.fillRect(t.x+t.w*.4,fl-H*.08,W*.026,H*.025);cx.fillStyle='#1a120e';cx.fillRect(t.x+t.w*.4+2,fl-H*.078,W*.026-4,H*.006);
  if(n.t>=16&&n.t<20){cx.strokeStyle='rgba(233,226,208,.3)';cx.lineWidth=1;for(let k=0;k<2;k++){cx.beginPath();cx.moveTo(t.x+t.w*.45+k*6,fl-H*.085);cx.quadraticCurveTo(t.x+t.w*.45+k*6+4,fl-H*.1,t.x+t.w*.45+k*6,fl-H*.115);cx.stroke();}}
  const sh=P.shelf;cx.fillStyle='#464d96';cx.fillRect(sh.x,sh.y,sh.w,H*.01);cx.fillStyle='#4a5090';cx.fillRect(sh.x+sh.w*.1,sh.y-H*.045,sh.w*.14,H*.045);cx.fillStyle='#6a7ac8';cx.fillRect(sh.x+sh.w*.28,sh.y-H*.05,sh.w*.14,H*.05);cx.fillStyle='#e9e2d0';cx.fillRect(sh.x+sh.w*.46,sh.y-H*.032,sh.w*.28,H*.032);
  const tk=P.tank;cx.fillStyle='rgba(120,160,230,.18)';cx.fillRect(tk.x,fl-tk.h,tk.w,tk.h);cx.strokeStyle='rgba(233,236,255,.25)';cx.lineWidth=1;cx.strokeRect(tk.x,fl-tk.h,tk.w,tk.h);
  for(let i=0;i<3;i++){const fx=tk.x+tk.w*(.2+.3*i)+Math.sin(el*.8+i)*tk.w*.08,fy=fl-tk.h*(.3+.25*i)+Math.cos(el*1.1+i)*tk.h*.08;cx.fillStyle=['#f3c66b','#c9a2e8','#8fd0f0'][i];cx.beginPath();cx.ellipse(fx,fy,tk.w*.045,tk.w*.026,0,0,7);cx.fill();}
}
function drawMe(el){
  const grown=Math.min(1,ageDays()/7);
  const r=S*(0.030+0.012*grown);
  const hop=me.resting?0:Math.abs(Math.sin(me.hop))*r*.5;
  const x=me.x,y=me.y-r*1.1-hop;
  const warm=0.5+0.5*mem.warm;
  if(!born()){ // 灯る前。床の上に、ほとんど見えないふわ
    const a=0.18+0.12*Math.sin(el*1.2);cx.fillStyle='rgba(235,240,255,'+a+')';
    for(const p of[[0,0,1],[-.6,.2,.7],[.6,.2,.7],[0,-.5,.75]])cx.beginPath(),cx.arc(x+p[0]*r,me.y-r*.9+p[1]*r,r*p[2]*.8,0,7),cx.fill();
    return;
  }
  // 光輪
  const g=cx.createRadialGradient(x,y,0,x,y,r*2.8);g.addColorStop(0,'rgba(255,240,205,'+(0.32*warm)+')');g.addColorStop(1,'rgba(243,198,107,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*2.8,0,7);cx.fill();
  // ふわふわ: 雲の粒。19 の雲と同じ血筋
  const breathe=me.resting?1+0.03*Math.sin(el*0.9):1+0.05*Math.sin(el*2.4+me.ph);
  const puffs=[[0,.05,1.0],[-.75,.3,.72],[.75,.3,.72],[-.45,-.45,.7],[.45,-.45,.7],[0,-.7,.62],[-.3,.5,.6],[.3,.5,.6]];
  for(const p of puffs){
    const px=x+p[0]*r*breathe,py=y+p[1]*r*breathe,pr=p[2]*r*.85*breathe;
    const pg=cx.createRadialGradient(px-pr*.3,py-pr*.3,pr*.1,px,py,pr);
    pg.addColorStop(0,'rgba(255,253,245,'+(0.98)+')');pg.addColorStop(.7,'rgba(246,240,232,'+(0.96)+')');pg.addColorStop(1,'rgba(220,214,240,'+(0.0)+')');
    cx.fillStyle=pg;cx.beginPath();cx.arc(px,py,pr,0,7);cx.fill();
  }
  // 目: 点が二つ。寝ているときは線
  const happy=performance.now()<me.happyUntil;
  if(happy){ // ほっぺ、ぽわわん
    const hk=Math.min(1,(me.happyUntil-performance.now())/600);
    for(const d of[-1,1]){const cg=cx.createRadialGradient(x+d*r*.5,y+r*.22,0,x+d*r*.5,y+r*.22,r*.22);cg.addColorStop(0,'rgba(255,170,185,'+(0.55*hk)+')');cg.addColorStop(1,'rgba(255,170,185,0)');cx.fillStyle=cg;cx.beginPath();cx.arc(x+d*r*.5,y+r*.22,r*.22,0,7);cx.fill();}
  }
  cx.fillStyle='#2a2440';
  if(happy){cx.strokeStyle='#2a2440';cx.lineWidth=1.5;cx.lineCap='round';for(const d of[-1,1]){cx.beginPath();cx.arc(x+d*r*.3,y+r*.06,r*.09,Math.PI*1.15,Math.PI*1.85);cx.stroke();}}
  else if(me.resting){cx.strokeStyle='#2a2440';cx.lineWidth=1.4;for(const d of[-1,1]){cx.beginPath();cx.moveTo(x+d*r*.3-r*.08,y+r*.02);cx.lineTo(x+d*r*.3+r*.08,y+r*.02);cx.stroke();}}
  else{const blink=(Math.sin(el*1.1+me.ph)>0.975)?0.15:1;for(const d of[-1,1]){cx.beginPath();cx.ellipse(x+d*r*.3+me.face*r*.05,y+r*.02,r*.065,r*.09*blink,0,0,7);cx.fill();}}
  // 床の光
  cx.fillStyle='rgba(243,198,107,'+(0.12*warm)+')';cx.beginPath();cx.ellipse(me.x,me.y+2,r*1.6,r*.3,0,0,7);cx.fill();
  // 降ってくる星
  if(star){
    if(star.phase==='fall'){const sx=star.x0+Math.sin(el*2.2+star.ph)*S*.045;const gg=cx.createRadialGradient(sx,star.y,0,sx,star.y,r*1.2);gg.addColorStop(0,'rgba(255,240,190,.55)');gg.addColorStop(1,'rgba(243,198,107,0)');cx.fillStyle=gg;cx.beginPath();cx.arc(sx,star.y,r*1.2,0,7);cx.fill();
      cx.fillStyle='#ffe9a8';drawStar5(sx,star.y,r*.38,Math.sin(el*2.2+star.ph)*.4);cx.fill();cx.fillStyle='rgba(255,255,255,.8)';cx.beginPath();cx.arc(sx-r*.08,star.y-r*.1,r*.07,0,7);cx.fill();}
    else{const k=star.k,sc=Math.max(0,1-k);cx.fillStyle='rgba(255,233,168,'+(0.95*sc+0.05)+')';drawStar5(x,y+r*.25,r*.38*sc,k*3);cx.fill();}
  }
  // ハート、ぽぽぽ
  for(const h of hearts){const a=(performance.now()-h.born)/1000;const k=Math.min(1,a/2.2);const hx=h.x+Math.sin(a*2.5+h.ph)*r*.4,hy=h.y-a*r*1.5;const al=k<.15?k/.15:1-(k-.15)/.85;const hs=r*.26*(0.85+0.15*Math.sin(a*6));const hg=cx.createRadialGradient(hx,hy,0,hx,hy,hs*2.2);hg.addColorStop(0,'rgba(255,255,255,'+(0.35*al)+')');hg.addColorStop(1,'rgba(255,255,255,0)');cx.fillStyle=hg;cx.beginPath();cx.arc(hx,hy,hs*2.2,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,'+(0.95*al)+')';drawHeart(hx,hy,hs);cx.fill();}
  // 一行
  if(me.line&&performance.now()<me.lineUntil){const k=Math.min(1,(me.lineUntil-performance.now())/800);cx.font='400 '+(S*.03)+'px "Shippori Mincho",serif';cx.textAlign='center';cx.textBaseline='bottom';const tw=cx.measureText(me.line).width;const ly=y-r*2.3;cx.fillStyle='rgba(11,14,38,'+(0.55*k)+')';cx.beginPath();cx.roundRect(x-tw/2-S*.02,ly-S*.04,tw+S*.04,S*.05,S*.012);cx.fill();cx.fillStyle='rgba(233,236,255,'+(0.9*k)+')';cx.fillText(me.line,x,ly);}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const el=now/1000;
  const n=nowJST();const sky=skyAt(n.t),night=nightness(n.t);
  clockEl.textContent=String(n.h).padStart(2,'0')+':'+String(n.m).padStart(2,'0');
  if(born()&&now>me.until)start(pick(n.t),now);
  if(!born()){me.x=W*.5;me.y=P.fl;}
  const dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy);
  if(d>1.5){const sp=Math.min(d,S*0.5*dt);me.x+=dx/d*sp;me.y+=dy/d*sp;me.hop+=dt*7;me.face=dx<0?-1:1;}else me.hop=0;
  mem.warm=Math.max(0.25,mem.warm-dt/28800);
  if(star){const rr=S*(0.030+0.012*Math.min(1,ageDays()/7));
    if(star.phase==='fall'){star.y+=S*0.28*dt;me.tx=star.x0;me.ty=P.fl;me.until=now+1e5;me.resting=false;if(star.y>=P.fl-rr*1.3){star.phase='eat';star.k=0;me.happyUntil=now+2600;}}
    else{star.k+=dt/1.1;if(star.k>=1){star=null;mem.fed++;mem.warm=Math.min(1,mem.warm+0.3);save();me.until=now+5000;line(tx().yum,2600);say(tx().ate);}}}
  if(heartQueue>0&&now>=nextHeart){heartQueue--;nextHeart=now+220+Math.random()*120;const rr=S*(0.030+0.012*Math.min(1,ageDays()/7));hearts.push({x:me.x+(Math.random()-.5)*rr*.9,y:me.y-rr*2.2,born:now,ph:Math.random()*6});}
  for(let i=hearts.length-1;i>=0;i--)if(now-hearts[i].born>2200)hearts.splice(i,1);
  drawRoom(n,sky,night,el);drawMe(el);
  requestAnimationFrame(frame);
}
document.getElementById('feed').addEventListener('click',()=>{if(!born()){say(tx().before);return;}if(star)return;const x0=Math.min(Math.max(me.x+(Math.random()-.5)*W*.16,W*.1),W*.76);star={x0,y:-S*.05,ph:Math.random()*6,phase:'fall',k:0};me.act='idle';me.resting=false;me.until=performance.now()+1e5;});
document.getElementById('hug').addEventListener('click',()=>{if(!born()){say(tx().pet);mem.hugs++;save();return;}mem.hugs++;mem.warm=Math.min(1,mem.warm+0.2);save();me.until=performance.now()+6000;me.act='idle';me.resting=false;me.tx=me.x;me.ty=me.y;me.happyUntil=performance.now()+3000;heartQueue=6;nextHeart=performance.now();say(tx().hugged(myName()));});
document.getElementById('look').addEventListener('click',()=>{const t=tx();const a=t.act[me.act]||t.act.idle;say((born()?t.is(myName(),a):t.notyet)+t.stat(ageDays(),mem.fed,mem.hugs));});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;if(Math.hypot(px-me.x,py-(me.y-S*.04))<S*.1)document.getElementById('hug').click();});
resize();me.x=W*.5;me.y=P.fl;me.tx=me.x;me.ty=me.y;
requestAnimationFrame(frame);setInterval(save,30000);
})();
</script>
