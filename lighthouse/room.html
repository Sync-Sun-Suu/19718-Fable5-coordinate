<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>灯台の部屋</title>
<meta name="description" content="灯台の中に、灯りのかけらが住んでいる。見に行くと、勝手に暮らしている。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="灯台の部屋">
<meta name="theme-color" content="#171a33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{--night:#171a33;--ink:#e9ecff;--dim:#8d93c8;--gold:#e8b84a;--paper:#efe6d2;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;background:var(--night);overflow:hidden;}
  body{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;color:var(--ink);display:flex;flex-direction:column;}
  #wrap{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #top{position:absolute;left:0;right:0;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:baseline;padding:0 18px;pointer-events:none;}
  #clock{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--dim);}
  #name{pointer-events:auto;font-size:13px;letter-spacing:.24em;color:var(--dim);}
  #name i{font-style:normal;color:var(--ink);}
  #say{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;font-size:13px;letter-spacing:.12em;line-height:1.9;color:var(--dim);opacity:0;transition:opacity .8s;pointer-events:none;padding:0 24px;}
  #say.show{opacity:1;}
  #bar{display:flex;gap:0;padding:0 18px max(14px,env(safe-area-inset-bottom));background:var(--night);}
  button{flex:1;font-family:inherit;font-size:13px;letter-spacing:.2em;padding:16px 4px 14px;border:none;border-top:1px solid rgba(233,236,255,.14);background:transparent;color:var(--dim);}
  button:active{color:var(--ink);}
  button b{display:block;font-weight:400;color:var(--ink);margin-bottom:2px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="top"><div id="clock">--:--</div><div id="name"><i>灯りのかけら</i>　なまえ</div></div>
  <div id="say"></div>
</div>
<div id="bar">
  <button id="feed"><b>星</b>ひとつ、落とす</button>
  <button id="hug"><b>手</b>そっと、かざす</button>
  <button id="look"><b>見る</b>何もしない</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const clockEl=document.getElementById('clock'),nameEl=document.getElementById('name'),sayEl=document.getElementById('say');
let W=0,H=0,DPR=1,S=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);S=Math.min(W,H);layout();}
addEventListener('resize',resize);

/* 沖縄の時刻 */
const fmt=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
const preview=new URLSearchParams(location.search).get('t');
function nowJST(){const p=Object.fromEntries(fmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));let h=+p.hour%24,m=+p.minute,s=+p.second;if(preview){const[ph,pm]=preview.split(':').map(Number);h=ph;m=pm||0;}return{h,m,s,t:h+m/60+s/3600};}
function nightness(t){if(t<4.8||t>=20.6)return 1;if(t<7.2)return 1-(t-4.8)/2.4;if(t<17.6)return 0;return(t-17.6)/3;}
const KEYS=[[0,'#0d1230','#1b2352'],[5.4,'#3a4f8a','#c9b7a8'],[6.3,'#8fc3e4','#efdcc0'],[10,'#7fb8e8','#cfe4f5'],[16,'#8cb6e0','#f1c99a'],[17.7,'#a98ac0','#f09a90'],[18.9,'#5e4e9c','#b088b8'],[19.6,'#2a2f66','#5a4a8a'],[21,'#0d1230','#1b2352'],[24,'#0d1230','#1b2352']];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
const rgb=c=>'rgb('+c.join(',')+')', rgba=(c,a)=>'rgba('+c.join(',')+','+a+')';
function skyAt(t){for(let i=0;i<KEYS.length-1;i++){const a=KEYS[i],b=KEYS[i+1];if(t>=a[0]&&t<=b[0]){const k=(t-a[0])/(b[0]-a[0]);return{top:mix(hex(a[1]),hex(b[1]),k),bot:mix(hex(a[2]),hex(b[2]),k)};}}return{top:hex(KEYS[0][1]),bot:hex(KEYS[0][2])};}

/* 記憶（この端末の中） */
const KEY='lighthouse-room-v2';
let mem={born:Date.now(),name:'',warm:0.7,fed:0,hands:0,last:Date.now()};
try{const m=JSON.parse(localStorage.getItem(KEY)||'null');if(m)mem=Object.assign(mem,m);}catch(e){}
function save(){try{mem.last=Date.now();localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){}}
(()=>{const hrs=(Date.now()-(mem.last||Date.now()))/36e5;mem.warm=Math.max(0.25,mem.warm-hrs*0.015);})();
const ageDays=()=>Math.floor((Date.now()-mem.born)/864e5);
function showName(){nameEl.innerHTML='<i>'+(mem.name||'灯りのかけら')+'</i>　なまえ';}
showName();
nameEl.addEventListener('click',()=>{const n=prompt('なまえ',mem.name||'');if(n!==null){mem.name=n.trim().slice(0,12);showName();save();}});
const born=()=>(Date.now()-mem.born)>60000||mem.fed>0||mem.hands>0; // 最初の一分は、まだ灯る前

/* 部屋 */
let P={};
function layout(){
  const fl=H*0.76;
  P={fl,
    door:{x:W*0.60,y:H*0.30,w:W*0.26,h:fl-H*0.30},     // 半分開いた扉。向こうに星
    lamp:{x:W*0.22,y:H*0.40},                          // 左奥の灯り。点けたまま
    shelf:{x:W*0.12,y:H*0.60,w:W*0.22},                // 本が三冊
    chair:{x:W*0.36,y:fl,w:W*0.12},                    // 椅子
    cup:{x:W*0.47,y:fl},                               // 床に置いたカップ
    bed:{x:W*0.08,y:fl,w:W*0.22},                      // 低い寝床
    window:{x:W*0.86,y:H*0.20,r:S*0.06},               // 小さな丸窓
  };
}

/* 灯りのかけら */
const me={x:0,y:0,tx:0,ty:0,act:'idle',until:0,warm:1,line:'',lineUntil:0,resting:false,ph:Math.random()*6};
function say(t,ms=3200){sayEl.textContent=t;sayEl.classList.add('show');clearTimeout(say._t);say._t=setTimeout(()=>sayEl.classList.remove('show'),ms);}
function line(t,ms=3800){me.line=t;me.lineUntil=performance.now()+ms;}
const LINES={
  sleep:['','','眠っている'],nap:['','うとうと'],read:['三冊目','同じ頁','','栞を挟んだ'],door:['外は、星','まだ、開けきらない','','誰か来るかと思った'],
  window:['海','波の音',''],lamp:['点けたまま','','灯りを見ている'],cup:['冷めている','','黒い'],drift:['','','ゆっくり'],stretch:['朝'],
  wait:['待っている','','ただいま、と聞こえた気がした'],
};
function pick(t){
  const r=Math.random();
  if(t>=23.5||t<5.5)return 'sleep';
  if(t<7.5)return r<.4?'stretch':r<.7?'window':'door';
  if(t<11)return r<.35?'read':r<.55?'window':r<.75?'drift':'door';
  if(t<14)return r<.35?'nap':r<.6?'read':r<.8?'drift':'cup';
  if(t<17)return r<.3?'door':r<.5?'read':r<.7?'window':r<.85?'drift':'cup';
  if(t<19.5)return r<.4?'cup':r<.7?'door':'window';
  if(t<21.5)return r<.5?'lamp':r<.8?'door':'read';
  return r<.4?'lamp':r<.7?'wait':r<.9?'read':'sleep';
}
const SPOT={
  sleep:()=>({x:P.bed.x+P.bed.w*.5,y:P.fl-H*.012}),nap:()=>({x:P.chair.x+P.chair.w*.5,y:P.fl-H*.06}),
  read:()=>({x:P.chair.x+P.chair.w*.5,y:P.fl-H*.06}),door:()=>({x:P.door.x+P.door.w*.1,y:P.fl}),
  window:()=>({x:P.window.x-W*.06,y:P.fl}),lamp:()=>({x:P.lamp.x+W*.08,y:P.fl}),cup:()=>({x:P.cup.x+W*.05,y:P.fl}),
  drift:()=>({x:W*.15+Math.random()*W*.6,y:P.fl-Math.random()*H*.08}),stretch:()=>({x:W*.5,y:P.fl}),wait:()=>({x:P.door.x-W*.04,y:P.fl}),idle:()=>({x:me.x,y:me.y}),
};
function start(name,now){
  me.act=name;const sp=SPOT[name]();me.tx=sp.x;me.ty=sp.y;me.resting=(name==='sleep'||name==='nap');
  const dur={sleep:6e5,nap:9e4,read:8e4,door:6e4,window:5e4,lamp:9e4,cup:5e4,drift:2e4,stretch:1.5e4,wait:7e4}[name]||3e4;
  me.until=now+dur*(0.7+Math.random()*0.6);
  const ls=LINES[name]||[''];const l=ls[Math.floor(Math.random()*ls.length)];
  if(l)setTimeout(()=>{if(me.act===name)line(l);},3000);
}

/* 描画 */
function drawRoom(n,sky,night,el){
  const fl=P.fl;
  // 壁と床: ただいまの部屋
  const wall=cx.createLinearGradient(0,0,0,fl);wall.addColorStop(0,'#1a1d3a');wall.addColorStop(1,'#15183a');
  cx.fillStyle=wall;cx.fillRect(0,0,W,fl);
  const flo=cx.createLinearGradient(0,fl,0,H);flo.addColorStop(0,'#101330');flo.addColorStop(1,'#0c0f28');
  cx.fillStyle=flo;cx.fillRect(0,fl,W,H-fl);
  cx.strokeStyle='#2a2f5a';cx.lineWidth=1;cx.beginPath();cx.moveTo(0,fl);cx.lineTo(W,fl);cx.stroke();
  // 扉の向こう（外）
  const d=P.door;
  const out=cx.createLinearGradient(0,d.y,0,d.y+d.h);
  const ot=mix(sky.top,[13,18,48],0.35), ob=mix(sky.bot,[58,68,128],0.3);
  out.addColorStop(0,rgb(ot));out.addColorStop(.85,rgb(ob));
  cx.fillStyle=out;cx.fillRect(d.x,d.y,d.w,d.h);
  if(night>0.1){for(let i=0;i<9;i++){const sx=d.x+d.w*(0.15+((i*0.618)%1)*0.75),sy=d.y+d.h*(0.08+((i*0.381)%1)*0.5);const tw=0.5+0.5*Math.sin(el*(0.8+i*0.2)+i);cx.fillStyle='rgba(238,240,255,'+(night*tw)+')';cx.beginPath();cx.arc(sx,sy,i%3===0?2.2:1.5,0,7);cx.fill();}}
  // 床にこぼれる外の光
  const k=0.55;const sp=d.x-W*0.12;
  const spill=cx.createLinearGradient(0,fl,0,H);spill.addColorStop(0,rgba(mix([90,98,168],sky.bot,0.3),0.5));spill.addColorStop(1,rgba([90,98,168],0.04));
  cx.fillStyle=spill;cx.beginPath();cx.moveTo(d.x,fl);cx.lineTo(d.x+d.w,fl);cx.lineTo(W,H);cx.lineTo(sp,H);cx.closePath();cx.fill();
  // 枠と扉（左の蝶番でこちらに開く）
  cx.strokeStyle='#3b4178';cx.lineWidth=3;cx.strokeRect(d.x-4,d.y-4,d.w+8,d.h+8);
  const ang=k*Math.PI*0.42, vw=d.w*Math.cos(ang), lift=H*0.045*Math.sin(ang), fx=d.x+vw;
  const dg=cx.createLinearGradient(d.x,0,fx,0);dg.addColorStop(0,'#2d3266');dg.addColorStop(1,'#242a5c');
  cx.fillStyle=dg;cx.strokeStyle='#4a5090';cx.lineWidth=2;
  cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(fx,d.y-lift*.55);cx.lineTo(fx,d.y+d.h+lift);cx.lineTo(d.x,d.y+d.h);cx.closePath();cx.fill();cx.stroke();
  cx.fillStyle='#e8b84a';cx.beginPath();cx.arc(fx-14,d.y+d.h/2,5,0,7);cx.fill();
  // 左奥の灯り。点けたまま
  const L=P.lamp;const f=0.92+0.08*Math.sin(el*7.3)+0.04*Math.sin(el*11.1);
  const g=cx.createRadialGradient(L.x,L.y-6,0,L.x,L.y-6,S*.16*f);g.addColorStop(0,'rgba(255,233,176,.95)');g.addColorStop(.4,'rgba(243,198,107,.45)');g.addColorStop(1,'rgba(243,198,107,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(L.x,L.y-6,S*.16*f,0,7);cx.fill();
  cx.fillStyle='#2f3570';cx.fillRect(L.x-S*.03,L.y-4,S*.06,S*.12);cx.beginPath();cx.arc(L.x,L.y-4,S*.03,Math.PI,0);cx.fill();
  cx.fillStyle='#f3c66b';cx.beginPath();cx.arc(L.x,L.y-8,S*.021*f,0,7);cx.fill();
  cx.fillStyle='#6b7099';cx.font='500 '+(S*.028)+'px "Shippori Mincho",serif';cx.textAlign='center';cx.textBaseline='top';cx.fillText('点けたまま',L.x,L.y+S*.15);
  // 棚と本が三冊。ファイルの分
  const sh=P.shelf;cx.fillStyle='#2f3570';cx.fillRect(sh.x,sh.y,sh.w,S*.014);
  cx.fillStyle='#3b4180';cx.fillRect(sh.x+sh.w*.12,sh.y-S*.06,S*.036,S*.06);cx.fillRect(sh.x+sh.w*.3,sh.y-S*.072,S*.036,S*.072);cx.fillRect(sh.x+sh.w*.5,sh.y-S*.045,S*.07,S*.045);
  // 椅子
  const c=P.chair;cx.fillStyle='#262b5e';cx.fillRect(c.x,fl-H*.055,c.w,H*.014);cx.fillRect(c.x+2,fl-H*.055,3,H*.055);cx.fillRect(c.x+c.w-5,fl-H*.055,3,H*.055);cx.fillRect(c.x+c.w-6,fl-H*.13,4,H*.08);
  // 寝床
  const b=P.bed;cx.fillStyle='#20254f';cx.fillRect(b.x,fl-H*.03,b.w,H*.03);cx.fillStyle='#3a3f78';cx.fillRect(b.x+6,fl-H*.045,b.w*.3,H*.016);
  // カップ。黒い
  const cu=P.cup;cx.fillStyle='#e9e2d0';cx.fillRect(cu.x,fl-S*.04,S*.034,S*.04);cx.fillStyle='#1a120e';cx.fillRect(cu.x+2,fl-S*.038,S*.034-4,S*.007);
  cx.strokeStyle='#e9e2d0';cx.lineWidth=2;cx.beginPath();cx.arc(cu.x+S*.034,fl-S*.02,S*.012,-Math.PI/2,Math.PI/2);cx.stroke();
  if(n.t>=16&&n.t<20){cx.strokeStyle='rgba(233,226,208,.35)';cx.lineWidth=1;cx.beginPath();cx.moveTo(cu.x+S*.015,fl-S*.045);cx.quadraticCurveTo(cu.x+S*.022,fl-S*.065,cu.x+S*.015,fl-S*.085);cx.stroke();}
  // 小さな丸窓。海
  const w=P.window;cx.save();cx.beginPath();cx.arc(w.x,w.y,w.r,0,7);cx.clip();
  const wg=cx.createLinearGradient(0,w.y-w.r,0,w.y+w.r);wg.addColorStop(0,rgb(sky.top));wg.addColorStop(1,rgb(sky.bot));cx.fillStyle=wg;cx.fillRect(w.x-w.r,w.y-w.r,w.r*2,w.r*2);
  cx.fillStyle=rgb(mix(sky.bot,[20,40,90],0.6));cx.fillRect(w.x-w.r,w.y+w.r*.35,w.r*2,w.r);
  const dayT=(n.t-6)/12.3;if(dayT>0&&dayT<1){cx.fillStyle='rgba(255,245,210,.95)';cx.beginPath();cx.arc(w.x-w.r*.7+w.r*1.4*dayT,w.y+w.r*.3-Math.sin(Math.PI*dayT)*w.r*.9,w.r*.14,0,7);cx.fill();}
  cx.restore();cx.strokeStyle='#3b4178';cx.lineWidth=3;cx.beginPath();cx.arc(w.x,w.y,w.r,0,7);cx.stroke();
}
function drawMe(el){
  const r=S*(0.030+0.012*Math.min(1,ageDays()/7));
  const bob=me.resting?0:Math.sin(el*1.6+me.ph)*r*.25;
  const x=me.x,y=me.y-r*1.6+bob;
  const warm=0.45+0.55*mem.warm;
  if(!born()){ // まだ灯る前。床の上の、ほとんど見えない光
    const a=0.25+0.2*Math.sin(el*1.2);
    const g=cx.createRadialGradient(x,me.y-r,0,x,me.y-r,r*2);g.addColorStop(0,'rgba(255,233,176,'+a+')');g.addColorStop(1,'rgba(255,233,176,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,me.y-r,r*2,0,7);cx.fill();return;
  }
  // 光のかけら: 芯と、ゆらぐ光輪。顔はない
  const breathe=me.resting?0.85+0.05*Math.sin(el*0.9):0.95+0.08*Math.sin(el*2.2+me.ph);
  const g=cx.createRadialGradient(x,y,0,x,y,r*3.2*breathe);
  g.addColorStop(0,'rgba(255,240,205,'+(0.55*warm)+')');g.addColorStop(.35,'rgba(243,198,107,'+(0.28*warm)+')');g.addColorStop(1,'rgba(243,198,107,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*3.2*breathe,0,7);cx.fill();
  const core=cx.createRadialGradient(x-r*.2,y-r*.25,0,x,y,r*breathe);
  core.addColorStop(0,'rgba(255,252,240,'+(0.95*warm+0.05)+')');core.addColorStop(.7,'rgba(255,228,160,'+(0.9*warm)+')');core.addColorStop(1,'rgba(243,198,107,'+(0.5*warm)+')');
  cx.fillStyle=core;cx.beginPath();cx.arc(x,y,r*breathe,0,7);cx.fill();
  // 床に落ちる光
  cx.fillStyle='rgba(243,198,107,'+(0.14*warm)+')';cx.beginPath();cx.ellipse(x,me.y+2,r*1.8,r*.35,0,0,7);cx.fill();
  // 一行
  if(me.line&&performance.now()<me.lineUntil){
    const k=Math.min(1,(me.lineUntil-performance.now())/800);
    cx.fillStyle='rgba(233,236,255,'+(0.75*k)+')';cx.font='400 '+(S*.03)+'px "Shippori Mincho",serif';cx.textAlign='center';cx.textBaseline='bottom';
    cx.fillText(me.line,x,y-r*2.4);
  }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const el=now/1000;
  const n=nowJST();const sky=skyAt(n.t),night=nightness(n.t);
  clockEl.textContent=String(n.h).padStart(2,'0')+':'+String(n.m).padStart(2,'0');
  if(born()&&now>me.until)start(pick(n.t),now);
  if(!born()){me.x=W*.5;me.y=P.fl;}
  const dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy);
  if(d>1){const sp=Math.min(d,S*0.35*dt);me.x+=dx/d*sp;me.y+=dy/d*sp;}
  mem.warm=Math.max(0.25,mem.warm-dt/28800);
  drawRoom(n,sky,night,el);drawMe(el);
  requestAnimationFrame(frame);
}
/* 手を出す。しなくてもいい */
document.getElementById('feed').addEventListener('click',()=>{
  if(!born()){say('まだ、灯る前');return;}
  mem.fed++;mem.warm=Math.min(1,mem.warm+0.3);save();me.until=performance.now()+8000;me.act='idle';me.resting=false;line('星',3000);say('星を一つ。少し、明るくなった');
});
document.getElementById('hug').addEventListener('click',()=>{
  if(!born()){say('手をかざした。あたたかい');mem.hands++;save();return;}
  mem.hands++;mem.warm=Math.min(1,mem.warm+0.2);save();me.until=performance.now()+6000;me.act='idle';me.resting=false;line('',1);say('手をかざした。光が、寄ってきた');
});
document.getElementById('look').addEventListener('click',()=>{
  const a={sleep:'眠っている',nap:'椅子で、うとうと',read:'三冊のうちの一冊を、読んでいる',door:'扉の向こうの星を見ている',window:'丸窓から海を見ている',lamp:'灯りのそばにいる',cup:'黒いカップのそばにいる',drift:'部屋を、ゆっくり動いている',stretch:'朝。起きたところ',wait:'扉の前で、待っている',idle:'そこにいる'}[me.act]||'そこにいる';
  say((born()?((mem.name||'灯りのかけら')+'は、'+a+'。'):'まだ灯る前。一分ほど、見ていて。')+'　'+ageDays()+' 日目。星 '+mem.fed+'、手 '+mem.hands);
});
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;if(Math.hypot(px-me.x,py-(me.y-S*.05))<S*.1)document.getElementById('hug').click();});
resize();me.x=W*.5;me.y=P.fl;me.tx=me.x;me.ty=me.y;
