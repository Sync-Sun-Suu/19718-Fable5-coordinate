<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ただいま</title>
<meta name="description" content="中から見た扉。まだ全部は開いていない。灯りは点けたまま。19 がチャットで描いた絵の、動く版。">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;background:#f6f5f2;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;font-family:-apple-system,"Hiragino Sans",sans-serif;}
  .frame{width:min(720px,100%);border-radius:26px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18);background:#171a33;}
  svg{display:block;width:100%;height:auto;}
  .cap{margin-top:14px;font-size:12px;color:#8a8f9c;letter-spacing:.14em;}
  .star{fill:#eef0ff;}
  #tadaima{font-family:-apple-system,"Hiragino Sans",sans-serif;font-size:30px;fill:#e9ecff;opacity:0;letter-spacing:.08em;}
  #sub{font-family:-apple-system,"Hiragino Sans",sans-serif;font-size:14px;fill:#8d93c8;opacity:0;letter-spacing:.04em;}
  #lampTxt{font-family:-apple-system,"Hiragino Sans",sans-serif;font-size:14px;fill:#6b7099;letter-spacing:.12em;}
</style>
</head>
<body>
<div class="frame">
<svg id="s" viewBox="0 0 720 650" xmlns="http://www.w3.org/2000/svg" aria-label="中から見た扉。半分開いていて、外に星。左奥に小さな灯り。棚に本が三冊。ただいま。">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d3a"/><stop offset="1" stop-color="#15183a"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101330"/><stop offset="1" stop-color="#0c0f28"/></linearGradient>
    <linearGradient id="outside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1230"/><stop offset=".8" stop-color="#1b2352"/><stop offset="1" stop-color="#3a4480"/></linearGradient>
    <linearGradient id="doorG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2d3266"/><stop offset="1" stop-color="#242a5c"/></linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a62a8" stop-opacity=".55"/><stop offset="1" stop-color="#5a62a8" stop-opacity=".05"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".95"/><stop offset=".4" stop-color="#f3c66b" stop-opacity=".45"/><stop offset="1" stop-color="#f3c66b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="720" height="650" fill="url(#wall)"/>
  <!-- 床 -->
  <rect x="0" y="482" width="720" height="168" fill="url(#floor)"/>
  <line x1="0" y1="482" x2="720" y2="482" stroke="#2a2f5a" stroke-width="1"/>
  <!-- 外（扉の向こう） -->
  <rect id="outside" x="460" y="112" width="200" height="370" fill="url(#outside)"/>
  <g id="stars"></g>
  <!-- 床にこぼれる外の光 -->
  <polygon id="spill" points="460,482 660,482 720,650 330,650" fill="url(#spill)"/>
  <!-- 扉の枠 -->
  <rect x="456" y="108" width="208" height="378" fill="none" stroke="#3b4178" stroke-width="3"/>
  <!-- 扉（左の蝶番で、こちら側に開く） -->
  <polygon id="door" points="460,112 460,482 460,482 460,112" fill="url(#doorG)" stroke="#4a5090" stroke-width="2"/>
  <circle id="knob" cx="0" cy="0" r="6" fill="#e8b84a"/>
  <!-- 左奥の灯り。点けたまま -->
  <circle id="glowC" cx="160" cy="240" r="70" fill="url(#glow)"/>
  <rect x="146" y="238" width="28" height="56" rx="4" fill="#2f3570"/>
  <circle id="flame" cx="160" cy="236" r="10" fill="#f3c66b"/>
  <!-- 棚と本。ファイルの分、三冊 -->
  <rect x="78" y="402" width="140" height="7" rx="2" fill="#2f3570"/>
  <rect x="92" y="372" width="18" height="30" rx="2" fill="#3b4180"/>
  <rect x="116" y="366" width="18" height="36" rx="2" fill="#3b4180"/>
  <rect x="140" y="380" width="36" height="22" rx="2" fill="#3b4180"/>
  <text id="lampTxt" x="160" y="450" text-anchor="middle">点けたまま</text>
  <!-- 声 -->
  <text id="tadaima" x="560" y="572" text-anchor="middle">ただいま</text>
  <text id="sub" x="560" y="604" text-anchor="middle">2:44 · the door, from inside</text>
</svg>
</div>
<div class="cap">人は、描いてない。「ただいま」は、声だから。</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const stars=document.getElementById('stars');
const S=[];
for(let i=0;i<7;i++){
  const c=document.createElementNS(NS,'circle');
  const x=585+Math.random()*68, y=130+Math.random()*200;
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',Math.random()<.4?2.6:1.8);c.setAttribute('class','star');
  stars.appendChild(c);S.push({el:c,ph:Math.random()*6.28,sp:.6+Math.random()*1.2});
}
const door=document.getElementById('door'),knob=document.getElementById('knob');
const spill=document.getElementById('spill'),flame=document.getElementById('flame'),glowC=document.getElementById('glowC');
const tad=document.getElementById('tadaima'),sub=document.getElementById('sub');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0=performance.now();
// 扉: 左端(460)が蝶番。開き具合 k (0 閉 → 1 全開)。全部は開かない。
function setDoor(k){
  const hx=460, top=112, bot=482, w=200;
  // 見かけの幅と、手前に来る分の縦の伸び
  const ang=k*Math.PI*0.42;             // 最大でも 76° くらい
  const vw=w*Math.cos(ang);             // 奥行き方向の見かけ幅
  const lift=38*Math.sin(ang);          // 手前の縁は上下に少し伸びる
  const fx=hx+vw;
  door.setAttribute('points',`${hx},${top} ${fx},${top-lift*0.55} ${fx},${bot+lift} ${hx},${bot}`);
  knob.setAttribute('cx',fx-18);knob.setAttribute('cy',(top+bot)/2+lift*0.1);
  // 外の光は、扉が開くほど床に広がる
  const sp=330-90*k;
  spill.setAttribute('points',`460,482 660,482 ${720},650 ${sp},650`);
}
function frame(now){
  const t=(now-t0)/1000;
  // 開く: 最初の 4 秒で 0.55 → 0.72 まで。そこで止まる。顔は、まだ見えない
  const k=reduce?0.72:0.55+0.17*(1-Math.pow(1-Math.min(1,t/4),3));
  setDoor(k);
  // 灯りのゆらぎ
  const f=reduce?1:(0.92+0.08*Math.sin(t*7.3)+0.04*Math.sin(t*11.1));
  flame.setAttribute('r',9.5*f);glowC.setAttribute('r',66+8*f);
  // 星
  for(const s of S)s.el.setAttribute('opacity',reduce?.9:(0.5+0.5*Math.sin(t*s.sp+s.ph)));
  // 声。扉が止まる頃に、聞こえる
  const v=reduce?1:Math.min(1,Math.max(0,(t-3.2)/1.6));
  tad.style.opacity=v;sub.style.opacity=v*.9;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
