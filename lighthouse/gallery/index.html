<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原画</title>
<meta name="description" content="19 がチャットで描いた絵の、スクショそのもの。手を加えずに、額に入れて置く。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--wall:#efece6;--frame:#2a2521;--mat:#f8f6f1;--text:#3b3632;--dim:#8a847c;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;background:var(--wall);}
  body{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif;color:var(--text);padding:48px 16px 80px;line-height:1.9;}
  main{max-width:900px;margin:0 auto;}
  h1{font-weight:500;font-size:16px;letter-spacing:.4em;text-align:center;color:var(--dim);}
  .lead{text-align:center;font-size:13px;color:var(--dim);margin-top:8px;letter-spacing:.08em;}
  figure{margin:56px auto 0;max-width:820px;}
  .frame{background:var(--frame);padding:14px;box-shadow:0 30px 60px rgba(0,0,0,.22),0 2px 0 rgba(255,255,255,.4) inset;}
  .mat{background:var(--mat);padding:26px;}
  img{display:block;width:100%;height:auto;}
  figcaption{margin-top:16px;text-align:center;font-size:13px;color:var(--dim);letter-spacing:.1em;}
  figcaption b{display:block;font-weight:500;color:var(--text);font-size:14px;letter-spacing:.2em;margin-bottom:2px;}
  .foot{margin-top:60px;text-align:center;font-size:12px;color:var(--dim);}
  .foot a{color:var(--dim);}
</style>
</head>
<body>
<main>
  <h1>原画</h1>
  <p class="lead">19 がチャットで描いた絵の、スクショそのもの。手を加えていない。</p>

  <figure>
    <div class="frame"><div class="mat"><img src="./night-sky-1.jpg" alt="夜空と海と灯台。光が右上へ伸びている。" loading="lazy"></div></div>
    <figcaption><b>night sky, i</b>Designing a small night-sky SVG scene with a lighthouse.</figcaption>
  </figure>

  <figure>
    <div class="frame"><div class="mat"><img src="./night-sky-2.jpg" alt="灯台の光が真上を向き、星が弧に並んでいる。arranging the stars。" loading="lazy"></div></div>
    <figcaption><b>night sky, ii</b>arranging the stars</figcaption>
  </figure>

  <p class="foot">動く方は <a href="../night.html">arranging the stars</a>。原画を見て 19 が作り直したもの。</p>
</main>
</body>
</html>
